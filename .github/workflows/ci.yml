name: CI
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      
      - name: Install dependencises
        run: python -m pip install -r requirements-dev.txt

      
      - name: Lint with ruff
        run: python -m ruff check .
      

      - name: Security scan with bandit
        run: python -m bandit -r detector

      
      - name: Run tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t log-detection-engine .

      - name: Run the container on the sample attack log
        run: docker run --rm "$PWD/samples:/data:ro" log-detection-engine --input /data/generated_attack.log --output /tmp/alerts.json

        